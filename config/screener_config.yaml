# Screener Configuration for svgBA100 Financial Intelligence Platform (Sprint 3)

filters:
  roe_min: null
  debt_to_equity_max: null
  fcf_min: null
  revenue_cagr_5yr_min: null
  pat_cagr_5yr_min: null
  opm_min: null
  pe_max: null
  pb_max: null
  dividend_yield_min: null
  icr_min: null
  market_cap_min: null
  net_profit_min: null
  eps_cagr_min: null
  asset_turnover_min: null
  sales_min: null

rules:
  skip_de_for_financials: true
  debt_free_icr_is_infinity: true
  sort_by: "composite_quality_score"
  sort_order: "desc"

presets:
  Quality Compounder:
    description: "High ROE, low leverage, positive FCF, solid revenue growth"
    roe_min: 15.0
    debt_to_equity_max: 1.0
    fcf_min: 0.0
    revenue_cagr_5yr_min: 10.0

  Value Pick:
    description: "Low P/E, reasonable P/B, manageable leverage, dividend yield >1%"
    pe_max: 20.0
    pb_max: 4.5
    debt_to_equity_max: 2.0
    dividend_yield_min: 1.0

  Growth Accelerator:
    description: "Strong PAT and revenue growth with controlled debt"
    pat_cagr_5yr_min: 20.0
    revenue_cagr_5yr_min: 15.0
    debt_to_equity_max: 2.0

  Dividend Champion:
    description: "Healthy dividend yield, sustainable payout (<80%), positive FCF"
    dividend_yield_min: 2.0
    dividend_payout_max: 80.0
    fcf_min: 0.0

  Debt-Free Blue Chip:
    description: "Virtually debt-free blue chip with ROE >12% and revenue >5000 Cr"
    debt_to_equity_max: 0.05
    roe_min: 12.0
    sales_min: 5000.0

  Turnaround Watch:
    description: "Revenue CAGR 3yr >10%, positive latest FCF, and declining D/E YoY"
    revenue_cagr_3yr_min: 10.0
    fcf_min: 0.0
    de_declining_yoy: true

composite_score:
  scale: [0, 100]
  winsorize:
    p_lower: 10
    p_upper: 90
  sector_relative: true
  weights:
    profitability:
      total: 35
      components:
        roe: 15
        roce: 10
        npm: 10
    cash_quality:
      total: 30
      components:
        fcf_cagr: 15
        cfo_pat: 10
        fcf_positive: 5
    growth:
      total: 20
      components:
        revenue_cagr: 10
        pat_cagr: 10
    leverage:
      total: 15
      components:
        de_score: 10
        icr_score: 5

peer_engine:
  table_name: "peer_percentiles"
  metrics:
    - name: "ROE"
      column: "return_on_equity_pct"
      invert: false
    - name: "ROCE"
      column: "return_on_capital_employed_pct"
      invert: false
    - name: "NPM"
      column: "net_profit_margin_pct"
      invert: false
    - name: "D/E"
      column: "debt_to_equity"
      invert: true
    - name: "FCF"
      column: "free_cash_flow_cr"
      invert: false
    - name: "PAT CAGR 5yr"
      column: "pat_cagr_5yr"
      invert: false
    - name: "Revenue CAGR 5yr"
      column: "revenue_cagr_5yr"
      invert: false
    - name: "EPS CAGR 5yr"
      column: "eps_cagr_5yr"
      invert: false
    - name: "Interest Coverage"
      column: "interest_coverage"
      invert: false
    - name: "Asset Turnover"
      column: "asset_turnover"
      invert: false

